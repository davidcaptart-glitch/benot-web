name: Deploy BENOT a Hetzner

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build y despliegue en Hetzner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Despliegue via SSH ────────────────────────────
      # Secretos necesarios en GitHub → Settings → Secrets:
      #   HETZNER_HOST        IP o dominio del servidor
      #   HETZNER_USER        Usuario SSH (normalmente root o deploy)
      #   HETZNER_SSH_KEY     Clave privada SSH (el servidor debe tener la pública)
      - name: Desplegar en servidor
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key:      ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            cd /opt/benot-web

            # Actualizar código
            git pull origin main

            # Reconstruir imagen y reiniciar el contenedor
            docker compose build --no-cache web
            docker compose up -d --no-deps --force-recreate web

            # Limpiar imágenes antiguas
            docker image prune -f

            echo "✅ Despliegue completado"
