services:
  web:
    build:
      context: .
      args:
        # Variable pública necesaria en el bundle de cliente
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://benot.store}
    image: benot-web:latest
    container_name: benot-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Carga el fichero .env del servidor (NO lo subas al repo)
    env_file:
      - .env
    # Volumen de assets: permite añadir/cambiar imágenes sin reconstruir la imagen Docker.
    # Simplemente sube los archivos a /opt/benot-web/assets/ y reinicia el contenedor.
    volumes:
      - ./assets:/app/assets:ro
    # Healthcheck para que el proxy sepa cuándo está listo
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
